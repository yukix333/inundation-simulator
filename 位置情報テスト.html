<!doctype html>
<meta charset="utf-8">
<title>位置情報テスト</title>
<h1>位置情報が使えるか調べる</h1>
<p>このファイルをダブルクリックで開いた結果を見てください。</p>
<pre id="out" style="font-size:15px; line-height:1.6; background:#f4f4f4; padding:12px;">調査中...</pre>
<script>
const out = document.getElementById('out');
const lines = [];
lines.push('開き方(origin)      : ' + location.protocol);
lines.push('安全な文脈か        : ' + window.isSecureContext + '  ← true なら位置情報が使える見込み');
lines.push('位置情報APIの有無   : ' + !!navigator.geolocation);
lines.push('');
lines.push('位置情報を要求中... 許可ダイアログが出たら「許可」を押してください');
out.textContent = lines.join('\n');

navigator.geolocation.getCurrentPosition(
  p => {
    out.textContent = lines.slice(0,3).join('\n')
      + '\n\n★成功★\n緯度: ' + p.coords.latitude
      + '\n経度: ' + p.coords.longitude
      + '\n誤差: 約' + Math.round(p.coords.accuracy) + ' m';
  },
  e => {
    out.textContent = lines.slice(0,3).join('\n')
      + '\n\n×失敗×\nコード: ' + e.code + '\n理由: ' + e.message
      + '\n\n(コード1=拒否/非対応, 2=位置が特定できない, 3=時間切れ)';
  },
  {enableHighAccuracy:true, timeout:10000}
);
</script>
